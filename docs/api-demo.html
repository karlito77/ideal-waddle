<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riskintel API Walkthrough</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#f3f5f8; --card:#ffffff; --card-2:#f7f9fb; --code:#0f1419; --code-ink:#e6edf3; --ink:#111519; --ink-2:#4b545e; --muted:#7a838d;
  --line:rgba(17,21,25,.10); --accent:#1c5cab; --accent-wash:rgba(28,92,171,.08);
  --get:#2a78d6; --post:#1baf7a; --ok:#0ca30c; --bad:#d03b3b;
  --k:#8fc4ff; --s:#f2c99b; --n:#a6e3b7; --b:#d4b5ff; --c:#8b949e;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0e1114; --card:#171b20; --card-2:#1d2228; --code:#0a0d10; --code-ink:#e6edf3; --ink:#f2f4f6; --ink-2:#b4bcc6; --muted:#838c96;
    --line:rgba(255,255,255,.10); --accent:#5598e7; --accent-wash:rgba(85,152,231,.12); --get:#3987e5; --post:#199e70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0e1114; --card:#171b20; --card-2:#1d2228; --code:#0a0d10; --code-ink:#e6edf3; --ink:#f2f4f6; --ink-2:#b4bcc6; --muted:#838c96;
  --line:rgba(255,255,255,.10); --accent:#5598e7; --accent-wash:rgba(85,152,231,.12); --get:#3987e5; --post:#199e70;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:20px} h2{font-size:15px} h3{font-size:13px;color:var(--ink-2);font-weight:500}
p{margin:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;margin-bottom:18px}
.head p{color:var(--ink-2);max-width:70ch}
.head .mono{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.controls{display:flex;gap:8px;margin-left:auto}
button{font:500 13px var(--sans);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.steplist button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.layout{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.steplist{padding:6px;display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto;position:sticky;top:12px}
@media (max-width:760px){.steplist{position:static;max-height:220px}}
.steplist button{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px;color:var(--ink-2);font-weight:400}
.steplist button .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.steplist button .m{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:1px 5px;border-radius:4px;color:#fff}
.steplist button[aria-current="step"]{background:var(--accent-wash);color:var(--ink);font-weight:500}
.steplist button.done .n{color:var(--ok)}
.m.GET{background:var(--get)} .m.POST{background:var(--post)}

.main{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.title .n{font-family:var(--mono);color:var(--muted);font-size:12px}
.note{color:var(--ink-2);max-width:72ch}
.block{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.block .bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--card-2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.block .bar .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;margin-right:auto}
.status{font-weight:500;padding:1px 7px;border-radius:4px;color:#fff;background:var(--ok)}
.status.bad{background:var(--bad)}
pre{margin:0;padding:12px 14px;background:var(--code);color:var(--code-ink);font:12px/1.55 var(--mono);overflow-x:auto;max-height:420px;overflow-y:auto;white-space:pre}
pre .k{color:var(--k)} pre .s{color:var(--s)} pre .n{color:var(--n)} pre .b{color:var(--b)} pre .c{color:var(--c)}
.empty{padding:10px 14px;color:var(--muted);font-family:var(--mono);font-size:12px;background:var(--code);color:var(--c)}
.nav{display:flex;gap:8px;justify-content:flex-end}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;margin-top:22px}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:10px 12px;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding:0}
.panel pre{max-height:520px;border-radius:0 0 10px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">
  <div class="head">
    <div>
      <h1>Risk Intelligence Platform API</h1>
      <p>A fourth client joins the sample community and is walked from onboarding to a retention decision. Every response below was captured from the running FastAPI app; nothing is mocked.</p>
      <p class="mono">uvicorn riskintel.api.app:app · 23 operations on 21 paths · 23 tests passing</p>
    </div>
    <div class="controls"><button id="run" class="primary" type="button">Run all steps</button><button id="reset" type="button">Reset</button></div>
  </div>

  <div class="layout">
    <div class="card steplist" id="steps" role="list"></div>
    <div class="card main" id="main"></div>
  </div>

  <div class="card" style="margin-top:22px">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-demo" aria-selected="true" type="button">python scripts/demo.py</button>
      <button class="tab" role="tab" id="tab-test" aria-selected="false" type="button">pytest -q</button>
      <button class="tab" role="tab" id="tab-tree" aria-selected="false" type="button">package layout</button>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

nded_mean_severity":13988.416,"top_pool_causes":[["water",196955],["fire",169431],["auto.collision",150991]]}},{"title":"Fit the model","note":"Frequency and severity from the blend, then modifiers from the register and device coverage, then a 5,000-trial simulation.","method":"POST","path":"/models/tailspin/fit?trials=5000","body":null,"status":200,"response":{"model":{"annual_frequency":3.0432,"frequency_modifier":1.1978,"modifiers_applied":["+15% open fire issue","+12% open water issue","-7% IoT monitoring on water"],"severity_mu":9.4951,"severity_sigma":0.3191,"expected_severity":13988.416,"expected_annual_loss":50990.1886,"basis":"credibility 0.11 own / 0.89 pool"},"simulation":{"trials":5000,"mean":50876,"p50":47822,"p75":67683,"p90":88747,"p95":102308,"p99":129434,"max":173408}}},{"title":"SIR decision","note":"Four candidate retentions against a 150,000 appetite on 1-in-100 retained loss.","method":"POST","path":"/decisions/tailspin/sir","body":{"candidate_sirs":[10000,25000,50000,100000],"trials":5000,"appetite":{"max_retained_p99":150000}},"status":200,"response":{"recommended_sir":10000.0,"reasons":["lowest total cost of risk among feasible options (73,430)","expected retained 35,227, premium indication 21,126","1-in-100 retained 87,505 within appetite 150,000"],"rejected":{},"model_basis":"credibility 0.11 own / 0.89 pool","options":[{"sir":10000,"expected_retained":35227,"retained_p95":69380,"retained_p99":87505,"expected_ceded":15649,"premium_indication":21126,"total_cost_of_risk":73430},{"sir":25000,"expected_retained":50613,"retained_p95":102017,"retained_p99":127365,"expected_ceded":263,"premium_indication":355,"total_cost_of_risk":76670},{"sir":50000,"expected_retained":50876,"retained_p95":102308,"retained_p99":129434,"expected_ceded":0,"premium_indication":0,"total_cost_of_risk":76592},{"sir":100000,"expected_retained":50876,"retained_p95":102308,"retained_p99":129434,"expected_ceded":0,"premium_indication":0,"total_cost_of_risk":76592}]}},{"title":"Bad input is rejected","note":"Report date before occurrence date fails validation at the boundary with a 422.","method":"POST","path":"/losses","body":[{"client_id":"tailspin","line_of_business":"property","cause_of_loss":"x","occurrence_date":"2025-05-01","report_date":"2025-04-01"}],"status":422,"response":{"detail":[{"msg":"Value error, report_date cannot precede occurrence_date","loc":["body",0]}]}}],"demo_out":"== Northwind Logistics ==\nclaims 31 over 2021-2025, trended incurred 490,495\nfrequency 0.049 per $1m revenue, mean severity 15,822, p90 23,514\n\n== peers ==\n  contoso    score 0.97 location=True activity_depth=4\n\n== benchmark == pool 30 claims from 1 member(s); credibility on own 0.554\n  frequency own 0.049 vs pool 0.063 -> blended 0.055\n  severity  own 15,822 vs pool 13,867 -> blended 14,949\n\n== shared peer issues ==\n  [critical] Sprinkler impairment during roof works (from d7d561e6eb09)\n\n== model == credibility 0.55 own / 0.45 pool\n  annual frequency 7.00 x modifier 1.1337 (+15% open fire issue, +6% open injury issue, -7% IoT monitoring on water)\n  expected severity 14,949, expected annual loss 118,697\n  aggregate: mean 118,995 p50 108,801 p90 201,504 p95 234,867 p99 308,770\n\n== SIR options (appetite: 1-in-100 retained <= 250,000) ==\n        SIR     E[ret]    P95 ret    P99 ret    premium       TCOR  status\n     25,000     96,889    168,796    204,522     29,843    162,685  recommended\n     50,000    112,216    208,137    257,991      9,151    169,328  1-in-100 retained 257,991 exceeds appetite 250,000\n    100,000    117,741    227,764    290,296      1,692    174,445  1-in-100 retained 290,296 exceeds appetite 250,000\n    250,000    118,950    234,867    308,678         60    176,969  1-in-100 retained 308,678 exceeds appetite 250,000\n    500,000    118,993    234,867    308,770          3    176,933  1-in-100 retained 308,770 exceeds appetite 250,000\n\nreasons:\n  - lowest total cost of risk among feasible options (162,685)\n  - expected retained 96,889, premium indication 29,843\n  - 1-in-100 retained 204,522 within appetite 250,000\n","test_out":".......................                                                  [100%]\n23 passed in 0.67s\n","tree":" 1972 total\nriskintel/__init__.py\nriskintel/analytics/__init__.py\nriskintel/analytics/experience.py\nriskintel/analytics/triangles.py\nriskintel/api/__init__.py\nriskintel/api/app.py\nriskintel/api/deps.py\nriskintel/api/routers/__init__.py\nriskintel/api/routers/clients.py\nriskintel/api/routers/community.py\nriskintel/api/routers/decisions.py\nriskintel/api/routers/iot.py\nriskintel/api/routers/losses.py\nriskintel/api/routers/models.py\nriskintel/api/routers/risk_issues.py\nriskintel/community/__init__.py\nriskintel/community/cohorts.py\nriskintel/community/consent.py\nriskintel/community/exchange.py\nriskintel/decisions/__init__.py\nriskintel/decisions/sir.py\nriskintel/demo.py\nriskintel/domain/__init__.py\nriskintel/domain/entities.py\nriskintel/domain/enums.py\nriskintel/ingestion/__init__.py\nriskintel/ingestion/iot.py\nriskintel/ingestion/loss_history.py\nriskintel/ingestion/risk_issues.py\nriskintel/modelling/__init__.py\nriskintel/modelling/frequency_severity.py\nriskintel/modelling/retention.py\nriskintel/modelling/simulation.py\nriskintel/pipeline.py\nriskintel/storage/__init__.py\nriskintel/storage/repository.py\n"};
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(obj){
  const json = JSON.stringify(obj, null, 2);
  return esc(json).replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b/g, (m, str, colon, kw) => {
    if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`;
    if (kw) return `<span class="b">${kw}</span>`;
    return `<span class="n">${m}</span>`;
  });
}
let cur = 0, done = new Set(), timer = null;
const list = document.getElementById("steps"), main = document.getElementById("main");
D.steps.forEach((s, i) => {
  const b = document.createElement("button"); b.type = "button"; b.id = "step-" + i; b.setAttribute("role", "listitem");
  b.innerHTML = `<span class="n">${String(i+1).padStart(2,"0")}</span><span>${esc(s.title)}</span><span class="m ${s.method}">${s.method}</span>`;
  b.addEventListener("click", () => { stop(); show(i); });
  list.appendChild(b);
});
function show(i){
  cur = i; done.add(i);
  const s = D.steps[i];
  list.querySelectorAll("button").forEach((b, j) => { b.toggleAttribute("aria-current", j === i); if (j === i) b.setAttribute("aria-current", "step"); b.classList.toggle("done", done.has(j)); });
  const ok = s.status < 400;
  main.innerHTML = `
    <div class="title"><span class="n">step ${i+1} of ${D.steps.length}</span><h2>${esc(s.title)}</h2></div>
    ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
    <div class="block"><div class="bar"><span class="lbl">request</span><span class="m ${s.method}" style="color:#fff;padding:1px 6px;border-radius:4px">${s.method}</span><span>${esc(s.path)}</span></div>${s.body !== null ? `<pre>${hl(s.body)}</pre>` : `<div class="empty">no body</div>`}</div>
    <div class="block"><div class="bar"><span class="lbl">response</span><span class="status ${ok ? "" : "bad"}">${s.status}</span><span style="color:var(--muted)">${ok ? "application/json" : "validation error"}</span></div><pre>${hl(s.response)}</pre></div>
    <div class="nav"><button type="button" id="prev" ${i===0?"disabled":""}>Previous</button><button type="button" id="next" class="primary" ${i===D.steps.length-1?"disabled":""}>Next step</button></div>`;
  document.getElementById("prev").addEventListener("click", () => { stop(); show(i-1); });
  document.getElementById("next").addEventListener("click", () => { stop(); show(i+1); });
  const active = list.querySelector('[aria-current="step"]'); if (active) active.scrollIntoView({block:"nearest"});
}
function stop(){ if (timer) { clearInterval(timer); timer = null; document.getElementById("run").textContent = "Run all steps"; } }
document.getElementById("run").addEventListener("click", () => {
  if (timer) { stop(); return; }
  done.clear(); show(0); document.getElementById("run").textContent = "Stop";
  timer = setInterval(() => { if (cur >= D.steps.length-1) { stop(); return; } show(cur+1); }, 900);
});
document.getElementById("reset").addEventListener("click", () => { stop(); done.clear(); show(0); });

const panels = { "tab-demo": D.demo_out, "tab-test": D.test_out, "tab-tree": D.tree };

show(0);
